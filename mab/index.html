<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAB International Hospital Staff Reporting App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a fixed demo-clock strip on top, then one working column for staff screens and a wide table desk for M&E. */
:root{
  color-scheme:light;
  /* palette sampled from the MAB International Hospital logo: navy, sky blue, orange-red, on white */
  --bg:#ffffff; --surface:#ffffff; --ink:#0f2233; --muted:#55677a; --line:#d3dde7;
  --accent:#004878; --accent-ink:#ffffff; --accent-soft:#e6f5fe;   /* logo navy, with a sky tint */
  --accent2:#38b0f8; --accent2-ink:#0a6aa3;                         /* logo sky blue; darker shade for text */
  --good:#1c7a3c; --good-soft:#e2f3e7; --warn:#9a5600; --warn-soft:#fbeed6;
  --bad:#f02800; --bad-ink:#c42100; --bad-soft:#fde9e5;             /* logo orange-red; darker shade for text */
  --clock:#004878; --clock-ink:#ffffff;
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:20px} h2{font-size:22px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clock{background:var(--clock);color:var(--clock-ink);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.clock strong{font-size:14px}
.clock .presets{display:flex;flex-wrap:wrap;gap:6px}
.clock button,.clock input{background:transparent;border:1px solid rgba(255,255,255,.28);color:inherit;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}
.clock button:hover{background:rgba(255,255,255,.12)}
.clock .hint{flex-basis:100%;opacity:.75}
.clock input[type=time]{width:auto;background:transparent;border:1px solid rgba(255,255,255,.28);padding:4px 9px}
.tlist{display:flex;flex-direction:column;gap:8px}
.tlist > div{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.tlist .hd{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border-bottom:3px solid var(--bad)}
.top h1{color:var(--accent)}
.brand{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.logo{height:48px;width:auto;max-width:100%;display:block}
.top .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.tabs{display:flex;gap:4px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent2-ink);border-bottom-color:var(--accent2)}
main{padding:20px 16px 48px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
main.wide{max-width:1180px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card > header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.sub{color:var(--muted);font-size:13px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.facts div span{display:block;color:var(--muted);font-size:12px}
.notice{border-left:4px solid var(--accent2);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0}
.notice.warn{border-color:var(--warn);background:var(--warn-soft)}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}
.notice.good{border-color:var(--good);background:var(--good-soft)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap;background:var(--line);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)} .pill.acc{background:var(--accent-soft);color:var(--accent2-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
input[type=text],input[type=time],input[type=date],input[type=password],select,textarea{border:1px solid #b9c6d6;background:var(--bg);border-radius:7px;padding:8px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.task{border:1px solid var(--line);border-radius:9px;padding:12px;display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}
.task .wide2{grid-column:span 2}
.tick{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.tick input{width:auto}
.confirm{display:flex;flex-direction:column;gap:6px}
.why{display:flex;flex-direction:column;gap:2px;min-width:180px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.task .full{grid-column:1/-1}
.task .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
@media (max-width:640px){.task{grid-template-columns:1fr 1fr}.task .wide2{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--accent2);color:var(--accent2-ink);background:none;border-radius:999px;padding:3px 11px;cursor:pointer;font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--accent-soft)} tr.sel td{background:var(--accent-soft)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.person{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.person:hover,.person[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.person b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile b{font-family:var(--display);font-size:26px;display:block}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent2)}
.stars{display:flex;gap:6px}
.stars button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.stars button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
details summary{cursor:pointer;font-weight:600}
.err{color:var(--bad-ink);font-weight:600}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.signin label{display:block}
.signin .row{align-items:flex-end;gap:12px;flex-wrap:wrap}
.signin #staffid{text-transform:uppercase;letter-spacing:.08em}
.policy ul,.policy ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.policy p{margin:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* MAB International Hospital Staff Reporting App — access gate and hosted data store.
   The published page carries no database keys. It asks for the site access code, sends that code to
   Supabase to be checked, and only then receives the settings and starts the app. A stranger who finds
   the address sees the code box and nothing else.
   Once started, this gives the page the same small interface it uses inside Claude:
   window.claude.use("db" | "user" | "downloads"). */
(function () {
  "use strict";
  var ENTRY = "https://mstkpyqtnbkjzlnnkxrt.supabase.co/functions/v1/entry";

  var URL_BASE = "", KEY = "", REST = "", HEAD = null;
  var started = false, go;
  var ready = new Promise(function (res) { go = res; });

  function begin(cfg) {
    if (started) return;
    started = true;
    URL_BASE = cfg.url; KEY = cfg.key;
    REST = URL_BASE + "/rest/v1";
    HEAD = { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" };
    connect();
    setInterval(function () { listeners.forEach(function (l) { if (!live || Date.now() - l.at > 15000) l.ping(); }); }, 4000);
    go();
  }

  /* ---------- the gate ---------- */
  function gate() {
    var wrap = document.createElement("div");
    wrap.id = "mab-gate";
    wrap.innerHTML =
      '<style>' +
      '#mab-gate{position:fixed;inset:0;z-index:99999;background:#f4f7fa;display:flex;align-items:center;justify-content:center;padding:24px;' +
      'font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#15283a}' +
      '#mab-gate .box{background:#fff;border:1px solid #dde5ec;border-radius:14px;padding:28px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,72,120,.08)}' +
      '#mab-gate img{width:200px;max-width:70%;display:block;margin:0 auto 18px}' +
      '#mab-gate h1{font-size:19px;margin:0 0 6px;color:#004878}' +
      '#mab-gate p.sub{margin:0 0 18px;color:#5c7489;font-size:14px}' +
      '#mab-gate label{display:block;font-size:13px;color:#5c7489;margin-bottom:6px}' +
      '#mab-gate input{width:100%;padding:11px 12px;font-size:16px;border:1px solid #c8d5e0;border-radius:8px}' +
      '#mab-gate input:focus{outline:2px solid #38b0f8;outline-offset:1px;border-color:#38b0f8}' +
      '#mab-gate button{margin-top:14px;width:100%;padding:12px;font-size:16px;font-weight:600;color:#fff;background:#004878;border:0;border-radius:8px;cursor:pointer}' +
      '#mab-gate button[disabled]{opacity:.6;cursor:default}' +
      '#mab-gate .err{color:#f02800;font-size:14px;margin:12px 0 0}' +
      '#mab-gate .foot{margin:16px 0 0;font-size:12px;color:#7d93a6;text-align:center}' +
      '</style>' +
      '<form class="box" id="mab-gate-form" autocomplete="off">' +
      '<img src="logo.webp" alt="MAB International Hospital">' +
      '<h1>Staff Reporting App</h1>' +
      '<p class="sub">This is a private demonstration. Enter the access code you were given.</p>' +
      '<label for="mab-code">Access code</label>' +
      '<input id="mab-code" type="password" autocomplete="off" autocapitalize="characters">' +
      '<button id="mab-go" type="submit">Continue</button>' +
      '<p class="err" id="mab-err" style="display:none"></p>' +
      '<p class="foot">MAB International Hospital &middot; Monitoring &amp; Evaluation</p>' +
      '</form>';
    document.body.appendChild(wrap);
    var form = wrap.querySelector("#mab-gate-form"),
        box = wrap.querySelector("#mab-code"),
        btn = wrap.querySelector("#mab-go"),
        err = wrap.querySelector("#mab-err");
    box.focus();
    function fail(msg) {
      err.textContent = msg; err.style.display = "";
      btn.disabled = false; btn.textContent = "Continue";
      box.value = ""; box.focus();
    }
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var code = (box.value || "").trim();
      if (!code) return;
      err.style.display = "none";
      btn.disabled = true; btn.textContent = "Checking…";
      fetch(ENTRY, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok && d.url && d.key) { wrap.parentNode.removeChild(wrap); begin(d); return; }
          fail("That code is not right. Try again.");
        })
        .catch(function () { fail("Could not check the code. Check your connection and try again."); });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", gate); else gate();

  /* ---------- documents ---------- */
  function err(message, code) { var e = new Error(message); e.code = code; return e; }
  function codeFor(status) {
    if (status === 401 || status === 403) return "revoked";
    if (status === 400 || status === 404 || status === 422) return "invalid_argument";
    if (status === 413 || status === 507) return "quota_exceeded";
    return "unavailable";
  }
  function api(path, opts) {
    opts = opts || {};
    return ready.then(function () {
      var h = {}; Object.keys(HEAD).forEach(function (k) { h[k] = HEAD[k]; });
      Object.keys(opts.headers || {}).forEach(function (k) { h[k] = opts.headers[k]; });
      return fetch(REST + path, { method: opts.method || "GET", headers: h, body: opts.body });
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw err("store " + r.status + ": " + t.slice(0, 200), codeFor(r.status)); });
      return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }
  var enc = encodeURIComponent;

  function rowsFor(prefix) {
    return api("/docs?select=path,data&path=like." + enc(prefix + "/*")).then(function (rows) { return rows || []; });
  }
  function snapDoc(path, row) {
    return { id: path.split("/").pop(), exists: !!row, data: function () { return row ? row.data : undefined; }, metadata: { fromCache: false } };
  }
  function snapColl(prefix, rows) {
    var docs = rows.map(function (r) { return { id: r.path.slice(prefix.length + 1), data: function () { return r.data; } }; });
    docs.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
    return { docs: docs, size: docs.length, metadata: { fromCache: false } };
  }

  /* One realtime channel for the whole table; each listener is told when anything under its path changes.
     A change only prompts a fresh read, so a dropped message costs at most the poll interval. */
  var listeners = [], live = false, nextRef = 1, hb = null;
  function notify(path) { listeners.forEach(function (l) { if (path === l.path || path.indexOf(l.path + "/") === 0) l.ping(); }); }
  function connect() {
    if (!window.WebSocket || !URL_BASE) return;
    var ws;
    try { ws = new WebSocket(URL_BASE.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + enc(KEY) + "&vsn=1.0.0"); }
    catch (e) { return; }
    ws.onopen = function () {
      ws.send(JSON.stringify({ topic: "realtime:docs", event: "phx_join", ref: String(nextRef++), payload: {
        config: { postgres_changes: [{ event: "*", schema: "public", table: "docs" }], private: false } } }));
      hb = setInterval(function () {
        try { ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", ref: String(nextRef++), payload: {} })); } catch (e) {}
      }, 25000);
    };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.event === "phx_reply" && m.topic === "realtime:docs") live = true;
      if (m.event !== "postgres_changes" || !m.payload || !m.payload.data) return;
      var d = m.payload.data, row = d.record || d.old_record;
      if (row && row.path) notify(row.path);
    };
    ws.onclose = function () {
      live = false; if (hb) { clearInterval(hb); hb = null; }
      setTimeout(connect, 3000);                  // the poll covers the gap
    };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  function watch(path, read, cb, errCb) {
    var l = { path: path, at: 0, busy: false, again: false, last: null, dead: false };
    l.ping = function () {
      if (l.dead || !started) return;
      if (l.busy) { l.again = true; return; }
      l.busy = true;
      read().then(function (out) {
        l.busy = false; l.at = Date.now();
        var sig = JSON.stringify(out.sig);
        if (sig !== l.last) { l.last = sig; try { cb(out.snap); } catch (e) {} }
        if (l.again) { l.again = false; l.ping(); }
      }, function (e) {
        l.busy = false; l.at = Date.now();
        if (l.again) { l.again = false; l.ping(); } else if (errCb) { try { errCb(e); } catch (e2) {} }
      });
    };
    listeners.push(l); l.ping();
    return function () { l.dead = true; listeners = listeners.filter(function (x) { return x !== l; }); };
  }

  function docRef(path) {
    return {
      get: function () { return api("/docs?select=path,data&path=eq." + enc(path)).then(function (r) { return snapDoc(path, r && r[0]); }); },
      set: function (data) {
        return api("/docs?on_conflict=path", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify({ path: path, data: data }) }).then(function () { notify(path); });
      },
      delete: function () { return api("/docs?path=eq." + enc(path), { method: "DELETE", headers: { Prefer: "return=minimal" } }).then(function () { notify(path); }); },
      onSnapshot: function (cb, errCb) {
        return watch(path, function () {
          return api("/docs?select=path,data&path=eq." + enc(path)).then(function (r) {
            return { sig: r && r[0] ? r[0].data : null, snap: snapDoc(path, r && r[0]) };
          });
        }, cb, errCb);
      }
    };
  }
  function collRef(prefix) {
    var self = {
      limit: function () { return self; },
      onSnapshot: function (cb, errCb) {
        return watch(prefix, function () {
          return rowsFor(prefix).then(function (rows) {
            var snap = snapColl(prefix, rows);
            return { sig: snap.docs.map(function (d) { return [d.id, d.data()]; }), snap: snap };
          });
        }, cb, errCb);
      }
    };
    return self;
  }

  var DB = { doc: function (path) { return docRef(path); }, collection: function (name) { return collRef(name); } };

  /* ---------- Excel download ---------- */
  var DOWNLOADS = {
    save: function (o) {
      return new Promise(function (res, rej) {
        try {
          var url = URL.createObjectURL(o.data instanceof Blob ? o.data : new Blob([o.data]));
          var a = document.createElement("a");
          a.href = url; a.download = o.filename || "download"; a.style.display = "none";
          document.body.appendChild(a); a.click();
          setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); res({ ok: true }); }, 1000);
        } catch (e) { rej(e); }
      });
    }
  };

  /* ---------- staff sign-in ---------- */
  window.__AUTH__ = {
    verify: function (id, pin) {
      return ready.then(function () {
        return fetch(REST + "/rpc/verify_pin", { method: "POST", headers: HEAD, body: JSON.stringify({ p_id: String(id || ""), p_pin: String(pin || "") }) });
      }).then(function (r) { if (!r.ok) throw err("sign-in " + r.status, codeFor(r.status)); return r.json(); })
        .then(function (v) { return v === true; });
    }
  };

  window.claude = {
    use: function (what) {
      if (what === "db") return ready.then(function () { return DB; });
      if (what === "downloads") return ready.then(function () { return DOWNLOADS; });
      if (what === "user") return ready.then(function () { return { can: function () { return Promise.resolve(true); } }; });
      return Promise.resolve(null);
    }
  };
})();

</script>

  const q=function(k){return rv?(rv[k]||rv.rating||0):0;};
  const qual=rv?3*q("q1"):null,cout=rv?(r.co?3*q("q2"):0):null,evid=rv?2*q("q3"):null;
  const auto=time+exec+comp,total=auto+(rv?qual+cout+evid:0),max=rv?100:60;
  return {time:time,qual:qual,exec:exec,cout:cout,evid:evid,comp:comp,auto:auto,total:total,max:max,pct:Math.round(100*total/max),done:done,part:part,n:r.tasks.length,counted:counted,reviewed:!!rv,missed:false};
}

function buildSeed(D){
  const keep=S;S={reports:{},recurring:{},windows:(keep&&keep.windows)||defW(),clock:{date:D,min:450}};
  const R=rng(20261112);
  const mate=u=>{const m=STAFF.filter(s=>s.dept===u.dept&&s.id!==u.id);return m.length?m[Math.floor(R()*m.length)].id:"S001";};
  const mk=(u,i,n)=>{const bank=BANK[u.dept];const base=u.shift==="night"?18*60:9*60;const span=u.shift==="night"?11*60:7*60;
    const pl=base+Math.round((span*(i+0.5)/n)/15)*15;
    return {id:tid(),desc:bank[i%bank.length],deliv:DELIV[i%DELIV.length],prio:PRIORITIES[Math.floor(R()*3)],planned:hm(pl),assist:mate(u),res:(R()<0.15?"Vehicle":"None"),unplanned:false,status:"",done:"",comment:"",carry:false,rolled:0,takenBy:null};};
  const why=function(t,d,deferred){t.cause=R()<0.5?"outside":"within";t.action="Rescheduled and followed up with the unit concerned";t.support=R()<0.3?"Approval from the head of department":"";t.revised=deferred?addDays(d,1):"";};
  STAFF.forEach(u=>{S.recurring[u.id]=BANK[u.dept].slice(0,2);});
  for(let k=3;k>=1;k--){
    const d=addDays(D,-k);
    STAFF.forEach(u=>{
      if(u.id==="S007"&&k===2)return;                       // a missed day
      const r=rep(u.id,d,true),wi=win(u,"ci",d),wo=win(u,"co",d);
      const late=R()<0.12;
      r.ci=late?wi.close+15+Math.floor(R()*40):wi.open+5+Math.floor(R()*100);r.ciLate=late;
      if(late)r.req.ci={reason:"Attended an early off-site meeting",at:wi.close+5,status:(R()<0.5?"exception":"approved"),by:(u.id==="S010"?"S009":"S010"),decidedAt:wi.close+12};
      r.confirm=true;r.chal="";
      const n=3+Math.floor(R()*3);for(let i=0;i<n;i++)r.tasks.push(mk(u,i,n));
      const nightOpen=(u.shift==="night"&&k===1);          // last night's shift: check-out is due this morning
      const skipOut=(u.id==="S002"&&k===1);                 // missed check-out with a pending late request
      if(nightOpen)return;
      if(skipOut){r.req.co={reason:"Was at an off-site workshop until 7pm with no network",at:wo.close+70,status:"pending",by:null};return;}
      r.tasks.forEach(t=>{const x=R();
        if(x<0.74){t.status="Completed";t.done=hm(toMin(t.planned)+Math.round((R()*70-45)/5)*5);}
        else if(x<0.84){t.status="Partially completed";t.done=hm(toMin(t.planned)+20);t.comment="About half done. "+REASONS[Math.floor(R()*4)];why(t,d,false);}
        else if(x<0.95){t.status="Not completed";t.comment=REASONS[Math.floor(R()*4)];why(t,d,false);}
        else{t.status="Deferred";t.comment=REASONS[Math.floor(R()*4)];t.carry=true;why(t,d,true);}
      });
      if(u.id==="S004"&&k===1){const t=r.tasks[r.tasks.length-1];t.status="Deferred";t.done="";t.comment="Stock list not received from stores";t.carry=true;t.cause="outside";t.action="Collect the list from stores first thing";t.support="";t.revised=D;}
      r.co=wo.open+10+Math.floor(R()*100);r.coLate=false;
      if(k>=2){r.review={by:(u.id==="S009"?"S011":u.id==="S010"?"S009":"S010"),q1:3+Math.floor(R()*3),q2:3+Math.floor(R()*3),q3:3+Math.floor(R()*3),comment:REVIEWS[Math.floor(R()*4)],excused:{},at:wo.close+120};
        if(u.id==="S004"&&k===2)r.appeal={reason:"Two tasks ran late because the ward round overran, which was outside my control.",at:wo.close+900,status:"pending"};}
    });
  }
  ["S001","S003","S008"].forEach((id,j)=>{const u=byId(id),r=rep(id,D,true);r.ci=abs(D,425+j*7);r.confirm=true;r.chal="";const n=4;for(let i=0;i<n;i++)r.tasks.push(mk(u,i+1,n));});
  const out={reports:S.reports,recurring:S.recurring};S=keep;return out;
}
function seedLocal(){const keepUser=S?S.user:null;S=baseState();S.user=keepUser;const sd=buildSeed(S.seedDate);S.reports=sd.reports;S.recurring=sd.recurring;S.mode="test";syncClock();}
async function resetRemote(){
  BUSY=true;NET="Loading demo data. This takes a few seconds.";render();
  try{
    const D=liveNow().date,sd=buildSeed(D);
    for(const k of RKEYS.slice()){if(!sd.reports[k])await DB.doc("reports/"+k).delete();}
    S.drafts={};S.codrafts={};S.ui.ack={};S.ui.tmp={};S.ui.csrc={};S.ui.editing=null;S.ui.sel=null;S.ui.rdraft=null;
    [PEND,FAILED,LASTPUT].forEach(function(o){Object.keys(o).forEach(function(k){delete o[k];});});SAVE="";
    for(const k of Object.keys(sd.reports))await DB.doc("reports/"+k).set(clone(sd.reports[k]));
    await DB.doc("meta/recurring").set({map:sd.recurring});await DB.doc("meta/absence").set({map:{}});
    await DB.doc("config/main").set({windows:defW(),mode:"test",test:{date:D,min:450},seedDate:D});

  BUSY=false;render();
}

function blankRow(){return {desc:"",deliv:"",planned:"",prio:"Medium",assist:"",res:"None",star:false,rolled:0};}
function newTask(x,unplanned){return {id:tid(),desc:String(x.desc).trim(),deliv:String(x.deliv||"").trim(),planned:x.planned,prio:x.prio||"Medium",assist:x.assist,res:x.res||"None",unplanned:!!unplanned,status:"",done:"",comment:"",carry:false,rolled:x.rolled||0,takenBy:null};}
/* Tasks to carry into the plan for `date`: the unfinished carried tasks of the last report, plus those from an older
   report whose check-out was only recorded (late) after that last plan had already been made, so they are not lost. */
function carryRows(u,date){
  const rows=[],last=lastRep(u.id,date);if(!last)return rows;
  const row=function(p,t){rows.push({desc:t.desc,deliv:t.deliv||"",planned:"",prio:t.prio||"Medium",assist:t.assist,res:t.res||"None",star:false,rolled:(t.rolled||0)+1,src:p.date+"|"+t.id});};
  Object.values(S.reports).filter(function(p){return p.id===u.id&&p.ci&&p.date<last.date;}).sort(function(a,b){return a.date<b.date?-1:1;})
    .forEach(function(p){p.tasks.forEach(function(t){if(t.after===last.date&&t.carry&&t.status!=="Completed")row(p,t);});});
  last.tasks.forEach(function(t){if(t.carry&&t.status!=="Completed")row(last,t);});
  return rows;
}
function ciDraft(u,r){
  const k=u.id+"_"+r.date,seen=S.ui.csrc||(S.ui.csrc={});
  if(!S.drafts[k]){
    const rows=carryRows(u,r.date);seen[k]={};rows.forEach(function(x){seen[k][x.src]=1;});
    if(!rows.length)rows.push(blankRow());
    S.drafts[k]=rows;
  }else if(!r.ci){
    // the draft was started earlier: add tasks carried since then (for example from a late check-out), once each
    const rows=S.drafts[k],got=seen[k]||(seen[k]={});
    carryRows(u,r.date).forEach(function(x){
      if(got[x.src])return;got[x.src]=1;
      if(rows.some(function(q){return q.desc===x.desc&&(q.rolled||0)===x.rolled;}))return;
      const blank=rows.findIndex(function(q){return !String(q.desc||"").trim()&&!q.planned&&!String(q.deliv||"").trim();});
      if(blank>=0)rows.splice(blank,1,x);else rows.push(x);
    });
  }
  return S.drafts[k];
}

}

function me(){return byId(S.user);}

function validOutcome(o,owner,r){
  if(!o||!o.status)return "Choose a status for every task.";
  const timed=(o.status==="Completed"||o.status==="Partially completed");
  if(timed&&!o.done)return "Enter the time completed for each completed or partially completed task.";
  if(timed&&owner&&r&&shiftMin(owner,o.done)>S.clock.min+1440*(dayIdx(S.clock.date)-dayIdx(r.date)))return "Time completed cannot be later than the current time ("+fmtTime(hm(S.clock.min))+").";
  if(o.status!=="Completed"){
    if(!String(o.comment||"").trim())return "Give the reason for each task that was not fully completed.";
    if(!o.cause)return "For each unfinished task, say whether the cause was within or outside the department's control.";
    if(!String(o.action||"").trim())return "Give a proposed corrective action for each unfinished task.";
    if(o.status==="Deferred"&&!o.revised)return "Give a revised completion date for each deferred task.";
    if(o.revised&&r&&o.revised<=r.date)return "The revised completion date must be after the report date.";
  }
  return "";
}
function applyOutcome(t,o){
  const un=o.status!=="Completed";
  t.status=o.status;t.done=(o.status==="Completed"||o.status==="Partially completed")?o.done:"";
  t.comment=un?String(o.comment).trim():"";t.cause=un?o.cause:"";t.action=un?String(o.action||"").trim():"";t.support=un?String(o.support||"").trim():"";t.revised=un?(o.revised||""):"";
  t.carry=o.status==="Deferred"||(un&&!!o.carry);t.noMore=false;
}

  const timer=setTimeout(function(){if(!(READY.rep&&READY.cfg)){NET="Shared data cannot be reached yet. Still trying. Check your connection.";remoteChanged();}},10000);
  const dead=function(){clearTimeout(timer);READY.rep=READY.cfg=true;NET="Shared data stopped updating. Reload the page to reconnect.";remoteChanged();};
  const reached=function(meta){if((!meta||!meta.fromCache)&&READY.rep&&READY.cfg&&NET.indexOf("reached")>=0)NET="";};
  DB.collection("reports").limit(1000).onSnapshot(function(snap){
    LASTREP=snap;applyReports(snap);READY.rep=true;reached(snap.metadata);
    remoteChanged();
  },dead);
  DB.doc("config/main").onSnapshot(function(d){
    READY.cfg=true;EMPTY=!d.exists&&!(d.metadata&&d.metadata.fromCache);
    if(d.exists){const c=clone(d.data());if(c.windows&&c.windows.day&&c.windows.night)S.windows=Object.assign(defW(),c.windows);S.mode=c.mode==="live"?"live":"test";if(c.test&&c.test.date)S.test=c.test;if(c.seedDate)S.seedDate=c.seedDate;}
    if(FIRSTCFG){FIRSTCFG=false;syncClock();S.ui.meDate=S.clock.date;}      // after a reload the review desk opens on the clock's own date
    reached(d.metadata);remoteChanged();
  },dead);
  DB.collection("meta").onSnapshot(function(snap){
    LASTMETA=snap;applyMeta(snap);
    remoteChanged();
  },function(){});
}
function boot(tries){
  if(!(window.claude&&typeof window.claude.use==="function")){if(tries>0){setTimeout(function(){boot(tries-1);},200);}else startLocal();return;}
  Promise.resolve(window.claude.use("downloads")).then(function(x){DL=x||null;if(S&&S.ui.tab==="me")remoteChanged();}).catch(function(){});
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(res){
    const db=res[0],user=res[1];if(!db){startLocal();return;}
    DB=db;MODE="remote";
    try{const j=JSON.parse(localStorage.getItem(LKEY)||"null");if(j){S.user=j.user||null;if(j.ui)S.ui=Object.assign(S.ui,j.ui,{meDate:liveNow().date,sel:null});S.drafts=j.drafts||{};S.codrafts=j.codrafts||{};}}catch(e){}
    subscribe();render();
    if(user&&typeof user.can==="function")Promise.resolve(user.can("data.write")).then(function(v){if(v===false){CANWRITE=false;remoteChanged();}}).catch(function(){});
  }).catch(function(){startLocal();});
}
let LASTP="";
function phase(){syncClock();const d=S.clock.date;return d+["regular","day","night"].map(function(sh){return ["ci","co"].map(function(k){const w=win({shift:sh},k,d),n=nowAbs();return winState({shift:sh},k,d)+winState({shift:sh},k,addDays(d,-1))+((n<w.close&&w.close-n<=30)?"!":"");}).join("");}).join("");}
setInterval(function(){if(!S||MODE==="boot")return;const p=phase(),el=document.querySelector(".clock strong");if(el)el.textContent=fmtDate(S.clock.date)+", "+fmtTime(hm(S.clock.min));if(p!==LASTP){const first=!LASTP;LASTP=p;if(!first)remoteChanged();}},15000);
S=baseState();render();boot(window.claude?0:(window.__NO_CLAUDE__?0:15));
</script>
